---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway
spec:
  selector:
    app: mcp-gateway
  ports:
    # proxy is the ONLY exposed port. The console (9091) is deliberately
    # NOT in this Service — it is an internal triage surface and must be
    # reached through a separate, RBAC-gated mechanism (kubectl port-forward
    # or a dedicated internal ingress).
    - name: proxy
      port: 9090
      targetPort: 9090
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway-upstream
spec:
  selector:
    app: mcp-server
  ports:
    - name: mcp
      port: 8090
      targetPort: 8090
      protocol: TCP
